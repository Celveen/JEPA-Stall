# Each action is one complete Rope push in the existing environment.
model_epoch: latest
n_evals: 10
goal_source: file
goal_H: 5
num_start_frames: 1
debug_dset_init: false
decode_for_viz: false
n_plot_samples: 0
wandb_logging: false
objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: last
planner:
  _target_: feedback_planner.FeedbackRopePlanner
  success_cd: 0.3
  name: mpc_cem
  max_iter: 20
  n_taken_actions: 1
  reuse_actions: true
  resim_from_start: false
  sub_planner:
    target: rope_ecp.ContextCEMPlanner
    horizon: 5
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 10
    eval_every: -1
  ecp:
    kappa: 2.0
    warmup_pushes: 3
    window_pushes: 3
    gamma_lo: 0.05
    gamma_hi: 0.15
    beta: 0.25
    alpha: 1.0
    base: 2.0
    component: S-only
    objective_scale: terminal
