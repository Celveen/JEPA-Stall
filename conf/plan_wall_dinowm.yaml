# DINO-WM's Wall evaluation (dino_wm conf/plan_wall.yaml) in this repo's units: goal_H, horizon and n_taken_actions are
# env steps here (divided by frameskip 5 in plan.py), so DINO-WM's goal_H 5 = 25. Start and goal are random states on
# opposite sides of the wall (random_state); success = position within 4.5 of the goal (env/wall/wall_env_wrapper.py).
#
#   open-loop CEM (DINO-WM Table 8: 0.74)  planner.max_iter=1
#   MPC-CEM (Table 8: 0.96)                planner.max_iter=<cap>; DINO-WM's own max_iter is null (replan until every
#                                          episode succeeds), so the per-iteration success curve is reported instead
defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: eval_outputs/wall_dinowm/${now:%Y%m%d%H%M%S}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 256
    gres: "gpu:h100:1"
    qos: "explore"
    timeout_min: 720

ckpt_base_path: ./checkpoints
model_name: null
model_epoch: latest

seed: 99
n_evals: 50
goal_source: 'random_state'
goal_H: 25
n_plot_samples: 10
decode_for_viz: false
num_start_frames: 1

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: last

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 1
  n_taken_actions: 25
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 25
    topk: 30
    num_samples: 300
    var_scale: 1
    opt_steps: 10
    eval_every: 1
  name: mpc_cem
